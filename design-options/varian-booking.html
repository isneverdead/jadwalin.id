<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Varian Booking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#f4f5f7;--page-ink:#101826;--page-muted:#4b5668;--page-line:#d5dae2;--page-accent:#1d4fd6;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0c0f14;--page-ink:#eef1f6;--page-muted:#a3adbd;--page-line:#262d3a;--page-accent:#7fa6ff}}
:root[data-theme="dark"]{--page:#0c0f14;--page-ink:#eef1f6;--page-muted:#a3adbd;--page-line:#262d3a;--page-accent:#7fa6ff}

/* ===== token per varian (terang) ===== */
.v{--bg:#eef5ff;--surface:#fff;--ink:#0d1b33;--muted:#4a5a75;--line:#d3e0f5;--accent:#1d5fd8;--on:#fff;--soft:#e3eeff;--warn:#8a4b00;
  --r:22px;--rs:14px;--bw:1px;--sh:0 14px 40px -18px rgba(29,95,216,.45);--f:'Bricolage Grotesque',system-ui,sans-serif;--fb:'Bricolage Grotesque',system-ui,sans-serif;--fw:800;--ls:-.03em}
.v[data-v="kertas"]{--bg:#f6f0e4;--surface:#fffaf0;--ink:#1a1a2e;--muted:#5b564a;--line:#d9ceb6;--accent:#1e3a8a;--on:#fff;--soft:#ece3cd;--warn:#7a3d00;
  --r:4px;--rs:2px;--bw:1px;--sh:none;--f:'Fraunces',Georgia,serif;--fb:'Source Sans 3',system-ui,sans-serif;--fw:600;--ls:-.01em}
.v[data-v="cetak"]{--bg:#eaf0fa;--surface:#fff;--ink:#0a2540;--muted:#46607f;--line:#a9bedc;--accent:#0b4fd1;--on:#fff;--soft:#dbe6f7;--warn:#8a4b00;
  --r:0;--rs:0;--bw:1px;--sh:none;--f:'IBM Plex Mono',ui-monospace,monospace;--fb:'IBM Plex Sans',system-ui,sans-serif;--fw:500;--ls:-.02em}
.v[data-v="tebal"]{--bg:#fff;--surface:#fff;--ink:#000;--muted:#3f3f3f;--line:#000;--accent:#2b4cff;--on:#fff;--soft:#ffd23f;--warn:#6b3a00;
  --r:12px;--rs:8px;--bw:2.5px;--sh:5px 5px 0 #000;--f:'Space Grotesk',system-ui,sans-serif;--fb:'Space Grotesk',system-ui,sans-serif;--fw:700;--ls:-.03em}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .v{--bg:#0a1224;--surface:#121c33;--ink:#eaf1ff;--muted:#9fb0cf;--line:#26365a;--accent:#6aa0ff;--on:#06122b;--soft:#1a2a4d;--warn:#ffc27a;--sh:0 14px 40px -18px #000}
  :root:not([data-theme="light"]) .v[data-v="kertas"]{--bg:#14130f;--surface:#1d1b16;--ink:#f3ecdc;--muted:#b3ab98;--line:#3a362b;--accent:#9db4ff;--on:#0b1233;--soft:#2a271e;--warn:#ffc27a;--sh:none}
  :root:not([data-theme="light"]) .v[data-v="cetak"]{--bg:#07122b;--surface:#0b1a3d;--ink:#e6efff;--muted:#9db3d8;--line:#2c4a86;--accent:#7fb0ff;--on:#04112b;--soft:#102552;--warn:#ffc27a;--sh:none}
  :root:not([data-theme="light"]) .v[data-v="tebal"]{--bg:#0d0d0d;--surface:#161616;--ink:#fff;--muted:#c4c4c4;--line:#fff;--accent:#7a92ff;--on:#000;--soft:#ffd23f;--warn:#ffc27a;--sh:5px 5px 0 #fff}
}
:root[data-theme="dark"] .v{--bg:#0a1224;--surface:#121c33;--ink:#eaf1ff;--muted:#9fb0cf;--line:#26365a;--accent:#6aa0ff;--on:#06122b;--soft:#1a2a4d;--warn:#ffc27a;--sh:0 14px 40px -18px #000}
:root[data-theme="dark"] .v[data-v="kertas"]{--bg:#14130f;--surface:#1d1b16;--ink:#f3ecdc;--muted:#b3ab98;--line:#3a362b;--accent:#9db4ff;--on:#0b1233;--soft:#2a271e;--warn:#ffc27a;--sh:none}
:root[data-theme="dark"] .v[data-v="cetak"]{--bg:#07122b;--surface:#0b1a3d;--ink:#e6efff;--muted:#9db3d8;--line:#2c4a86;--accent:#7fb0ff;--on:#04112b;--soft:#102552;--warn:#ffc27a;--sh:none}
:root[data-theme="dark"] .v[data-v="tebal"]{--bg:#0d0d0d;--surface:#161616;--ink:#fff;--muted:#c4c4c4;--line:#fff;--accent:#7a92ff;--on:#000;--soft:#ffd23f;--warn:#ffc27a;--sh:5px 5px 0 #fff}

*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--page);color:var(--page-ink);font:16px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 64px}
h1{font-size:clamp(1.6rem,5vw,2.4rem);line-height:1.1;margin:8px 0 8px;letter-spacing:-.02em}
.lead{color:var(--page-muted);max-width:60ch;margin:0 0 20px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:20px}
.bar button,.bar a{min-height:44px;min-width:44px;padding:0 16px;border:1px solid var(--page-line);background:transparent;color:var(--page-ink);border-radius:999px;font:inherit;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none}
.bar button[aria-pressed="true"]{background:var(--page-ink);color:var(--page);border-color:var(--page-ink)}
.bar .sep{width:1px;height:28px;background:var(--page-line);margin:0 4px}
.grid{display:grid;gap:28px;grid-template-columns:1fr}
@media(min-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.one{grid-template-columns:minmax(0,420px);justify-content:center}}
.cell h2{font-size:1rem;margin:0 0 4px}
.cell p.note{margin:0 0 12px;color:var(--page-muted);font-size:.9rem}
.cell[hidden]{display:none}

/* ===== layar booking ===== */
.v{background:var(--bg);color:var(--ink);font-family:var(--fb);border-radius:var(--r);border:var(--bw) solid var(--line);padding:18px;max-width:420px;width:100%;box-shadow:var(--sh);position:relative;overflow:hidden}
.v[data-v="kertas"]{background-image:repeating-linear-gradient(0deg,transparent 0 31px,color-mix(in srgb,var(--line) 45%,transparent) 31px 32px)}
.v[data-v="cetak"]{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px}
.v *{min-width:0}
.hd{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.logo{width:48px;height:48px;flex:none;display:grid;place-items:center;background:var(--accent);color:var(--on);border-radius:var(--rs);border:var(--bw) solid var(--line);font:var(--fw) 20px var(--f)}
.v[data-v="tebal"] .logo{border-color:#000}
.hd h3{font:var(--fw) 1.25rem/1.15 var(--f);letter-spacing:var(--ls);margin:0}
.hd small{color:var(--muted);font-size:.85rem}
.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.v[data-v="tebal"] .card{box-shadow:4px 4px 0 var(--line)}
.lab{font:600 .8rem/1 var(--fb);color:var(--muted);margin:0 0 10px;display:block}
.v[data-v="cetak"] .lab{font-family:var(--f);text-transform:lowercase}
.v[data-v="cetak"] .lab::before{content:'// '}
.svc{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.svc b{font:var(--fw) 1.05rem var(--f);letter-spacing:var(--ls)}
.price{font:var(--fw) 1.05rem var(--f);white-space:nowrap}
.days{display:grid;grid-template-columns:repeat(6,minmax(44px,1fr));gap:4px}
.card:has(.days){padding:12px 10px}
.day,.slot{min-height:48px;border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--rs);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:4px 0}
.day small{font-size:.7rem;color:var(--muted)}
.day b{font:var(--fw) 1rem var(--f)}
.day[aria-pressed="true"],.slot[aria-pressed="true"]{background:var(--accent);color:var(--on);border-color:var(--accent)}
.v[data-v="tebal"] .day[aria-pressed="true"],.v[data-v="tebal"] .slot[aria-pressed="true"]{border-color:#000;box-shadow:3px 3px 0 var(--line)}
.day[aria-pressed="true"] small{color:inherit}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{font:600 .95rem var(--f)}
.slot[disabled]{cursor:not-allowed;color:var(--muted);background:transparent;text-decoration:line-through}
.dp{background:var(--soft);border-radius:var(--r);border:var(--bw) solid var(--line);padding:14px;margin-bottom:14px;color:var(--ink)}
.v[data-v="tebal"] .dp{background:var(--soft);color:#000;border-color:#000}
.v[data-v="tebal"] .dp .row span{color:#000}
.row{display:flex;justify-content:space-between;gap:10px;font-size:.95rem;padding:3px 0}
.row span{color:var(--muted)}
.row b{font:var(--fw) 1rem var(--f)}
.dp p{margin:8px 0 0;font-size:.85rem;color:var(--muted)}
.v[data-v="tebal"] .dp p{color:#000}
.cta{width:100%;min-height:52px;border:var(--bw) solid var(--accent);background:var(--accent);color:var(--on);border-radius:var(--rs);font:var(--fw) 1.05rem var(--f);letter-spacing:var(--ls);cursor:pointer}
.v[data-v="aurora"] .cta,.v:not([data-v]) .cta{border-radius:999px}
.v[data-v="tebal"] .cta{border-color:#000;box-shadow:4px 4px 0 var(--line)}
.v[data-v="tebal"] .cta:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.fine{margin:10px 0 0;font-size:.8rem;color:var(--muted);text-align:center}
:where(.v) button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.v[data-v="tebal"] button:focus-visible{outline-color:#000}
:root[data-theme="dark"] .v[data-v="tebal"] button:focus-visible{outline-color:#fff}
.tag{display:inline-block;font:600 .75rem var(--fb);padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--ink);border:var(--bw) solid var(--line)}
.v[data-v="tebal"] .tag{color:#000;border-color:#000}
.spec{margin-top:10px;font-size:.88rem;color:var(--page-muted)}
.spec b{color:var(--page-ink)}
@media (prefers-reduced-motion:no-preference){
  .day,.slot,.cta{transition:background .18s,transform .18s,box-shadow .18s}
  .cta:hover{transform:translateY(-1px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Empat varian layar booking</h1>
  <p class="lead">Satu layar yang sama (pilih layanan, hari, jam, lalu DP manual), empat karakter visual. Semua tetap berwarna biru sebagai warna aplikasi. Data hanya contoh.</p>
  <div class="bar" role="group" aria-label="Tampilan">
    <button type="button" data-show="all" aria-pressed="true">Semua</button>
    <button type="button" data-show="langit" aria-pressed="false">Langit</button>
    <button type="button" data-show="kertas" aria-pressed="false">Kertas</button>
    <button type="button" data-show="cetak" aria-pressed="false">Cetak biru</button>
    <button type="button" data-show="tebal" aria-pressed="false">Tebal</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" data-theme-set="auto" aria-pressed="true">Otomatis</button>
    <button type="button" data-theme-set="light" aria-pressed="false">Terang</button>
    <button type="button" data-theme-set="dark" aria-pressed="false">Gelap</button>
    <a href="index.html">Kembali ke perbandingan</a>
  </div>
  <div class="grid" id="grid"></div>
</div>

<template id="tpl">
  <div class="v" data-v="">
    <div class="hd"><div class="logo" aria-hidden="true">S</div><div><h3>Salon Maharani</h3><small>jadwalin.id/salon-maharani</small></div></div>
    <div class="card"><span class="lab">Layanan</span>
      <div class="svc"><div><b>Potong rambut</b><br><small style="color:var(--muted)">60 menit</small></div><div class="price">Rp 75.000</div></div>
    </div>
    <div class="card"><span class="lab">Pilih hari · November 2026</span>
      <div class="days" data-days></div>
    </div>
    <div class="card"><span class="lab">Pilih jam</span>
      <div class="slots" data-slots></div>
    </div>
    <div class="dp">
      <div class="row"><span>DP 30%</span><b>Rp 22.500</b></div>
      <div class="row"><span>Sisa dibayar di tempat</span><b>Rp 52.500</b></div>
      <p>DP dibayar langsung ke penyedia lewat transfer atau QRIS miliknya, lalu unggah bukti. Slot ditahan 3 jam sampai diverifikasi.</p>
    </div>
    <button class="cta" type="button">Lanjut ke pembayaran DP</button>
    <p class="fine">jadwalin.id tidak memproses uang Anda.</p>
  </div>
</template>

<script>
(function(){
  var V=[
    {k:'langit',t:'Langit',n:'Lembut dan lapang: kartu bulat, bayangan biru halus, tombol pil. Paling dekat dengan Biru Tegas, tetapi lebih tenang dan tidak memakai label huruf kapital.',spec:'<b>Huruf:</b> Bricolage Grotesque. <b>Cocok untuk:</b> salon, klinik, kursus.'},
    {k:'kertas',t:'Kertas',n:'Seperti buku janji temu: latar krem bergaris, huruf serif, sudut hampir lancip, biru tinta.',spec:'<b>Huruf:</b> Fraunces + Source Sans 3. <b>Cocok untuk:</b> konsultan, notaris, terapis, usaha yang ingin terkesan tepercaya.'},
    {k:'cetak',t:'Cetak biru',n:'Gambar teknik: kisi halus, huruf monospasi, tanpa sudut membulat, label gaya komentar kode.',spec:'<b>Huruf:</b> IBM Plex Mono + Plex Sans. <b>Cocok untuk:</b> bengkel, studio, penyewaan alat, layanan teknis.'},
    {k:'tebal',t:'Tebal',n:'Garis hitam tebal, bayangan keras, aksen kuning. Berani dan mudah diingat, tombol terasa ditekan.',spec:'<b>Huruf:</b> Space Grotesk. <b>Cocok untuk:</b> studio kreatif, kelas, event, pasar anak muda.'}
  ];
  var DAYS=[['Sen',16],['Sel',17],['Rab',18],['Kam',19],['Jum',20],['Sab',21]];
  var SLOTS=[['09.00',0],['10.00',0],['11.00',1],['13.00',0],['14.00',0],['15.30',0]];
  var grid=document.getElementById('grid'),tpl=document.getElementById('tpl');
  V.forEach(function(v,i){
    var cell=document.createElement('section');cell.className='cell';cell.dataset.k=v.k;
    cell.innerHTML='<h2>'+(i+1)+'. '+v.t+'</h2><p class="note">'+v.n+'</p>';
    var f=tpl.content.firstElementChild.cloneNode(true);
    if(v.k!=='langit')f.dataset.v=v.k;else f.dataset.v='langit';
    var dd=f.querySelector('[data-days]'),ss=f.querySelector('[data-slots]');
    DAYS.forEach(function(d,j){
      var b=document.createElement('button');b.type='button';b.className='day';b.setAttribute('aria-pressed',j===1?'true':'false');
      b.setAttribute('aria-label',d[0]+' '+d[1]+' November');
      b.innerHTML='<small>'+d[0]+'</small><b>'+d[1]+'</b>';
      b.onclick=function(){dd.querySelectorAll('.day').forEach(function(x){x.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed','true')};
      dd.appendChild(b)});
    SLOTS.forEach(function(s,j){
      var b=document.createElement('button');b.type='button';b.className='slot';b.textContent=s[0];
      if(s[1]){b.disabled=true;b.setAttribute('aria-label',s[0]+', sudah terisi')}else b.setAttribute('aria-pressed',j===3?'true':'false');
      b.onclick=function(){ss.querySelectorAll('.slot').forEach(function(x){x.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed','true')};
      ss.appendChild(b)});
    cell.appendChild(f);
    var sp=document.createElement('p');sp.className='spec';sp.innerHTML=v.spec;cell.appendChild(sp);
    grid.appendChild(cell);
  });
  function show(k){
    document.querySelectorAll('[data-show]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.show===k))});
    document.querySelectorAll('.cell').forEach(function(c){c.hidden=!(k==='all'||c.dataset.k===k)});
    grid.classList.toggle('one',k!=='all');
  }
  document.querySelectorAll('[data-show]').forEach(function(b){b.onclick=function(){show(b.dataset.show)}});
  function theme(m){
    var r=document.documentElement;
    if(m==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',m);
    document.querySelectorAll('[data-theme-set]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.themeSet===m))});
    try{localStorage.setItem('jd-theme',m)}catch(e){}
  }
  document.querySelectorAll('[data-theme-set]').forEach(function(b){b.onclick=function(){theme(b.dataset.themeSet)}});
  window.addEventListener('message',function(e){if(e.data&&e.data.jdTheme)theme(e.data.jdTheme)});
  var q=new URLSearchParams(location.search),t=q.get('theme'),m='auto';
  try{m=localStorage.getItem('jd-theme')||'auto'}catch(e){}
  if(t==='light'||t==='dark')m=t;
  theme(m);
  var vv=q.get('v');if(vv)show(vv);
})();
</script>
</body>
</html>
